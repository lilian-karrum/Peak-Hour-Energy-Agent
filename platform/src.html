<title>Peak Hour Energy Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a plant control room. Sticky command bar (scenario + clock), five views that share one 24-hour playhead. */
:root{
  --bg:#ECF0EE; --panel:#FFFFFF; --panel2:#F5F8F6; --ink:#12201B; --ink2:#46564F; --ink3:#78877F; --line:#D3DCD7;
  --accent:#0E7C69; --accent-ink:#FFFFFF; --peak:#C8410B; --peakbg:rgba(200,65,11,.07); --ice:#1A6FC4; --solar:#C98A00; --gridc:#2C3A34; --base:#98A39E;
  --ok:#2B8A3E; --warn:#C26A00; --bad:#C42525; --idle:#8D9C95; --run:#16A34A; --future:rgba(236,240,238,.62);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --panel:#131C19; --panel2:#18231F; --ink:#E4EDE8; --ink2:#A6B6AE; --ink3:#72837B; --line:#26332E;
  --accent:#2BC2A3; --accent-ink:#06201A; --peak:#FF7D45; --peakbg:rgba(255,125,69,.08); --ice:#4FA8F5; --solar:#F5BE32; --gridc:#C6D2CC; --base:#66736D;
  --ok:#51CF66; --warn:#FFA94D; --bad:#FF6B6B; --idle:#5B6B64; --run:#3BD16F; --future:rgba(12,19,17,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --panel:#131C19; --panel2:#18231F; --ink:#E4EDE8; --ink2:#A6B6AE; --ink3:#72837B; --line:#26332E;
  --accent:#2BC2A3; --accent-ink:#06201A; --peak:#FF7D45; --peakbg:rgba(255,125,69,.08); --ice:#4FA8F5; --solar:#F5BE32; --gridc:#C6D2CC; --base:#66736D;
  --ok:#51CF66; --warn:#FFA94D; --bad:#FF6B6B; --idle:#5B6B64; --run:#3BD16F; --future:rgba(12,19,17,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
.eyebrow{font:500 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

/* command bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:22px;line-height:1}
.brand .sub{font-size:12px;color:var(--ink3)}
.spacer{flex:1}
.scen-pick{display:flex;align-items:center;gap:8px}
.scen-pick select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:260px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.badge.live .dot{background:var(--run);box-shadow:0 0 0 3px color-mix(in srgb,var(--run) 25%,transparent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:9px 14px 10px;color:var(--ink2);text-decoration:none;font:600 14px/1 var(--f-body);border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.tabs a:hover{color:var(--ink)}
.play{display:flex;align-items:center;gap:12px;padding-block:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink3)}
.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.clock{font:600 26px/1 var(--f-mono);min-width:76px}
.scrub{flex:1;min-width:180px;accent-color:var(--accent)}
.band-chip{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.band-chip.peak{color:var(--peak);border-color:color-mix(in srgb,var(--peak) 45%,transparent);background:var(--peakbg)}
.speed{display:flex;gap:2px}
.speed button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 7px;font-size:12px;cursor:pointer;color:var(--ink2)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding-block:18px 48px}
@media (max-width:700px){.bar{position:relative;top:0}.brand .sub,.scen-pick label{display:none}.brand h1{font-size:19px}.view-head h2{font-size:26px}}
.view-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.view-head h2{font-size:30px;line-height:1.05}
.view-head p{margin:4px 0 0;color:var(--ink2);max-width:72ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel h3{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.box{height:10px;width:10px;border-radius:2px}
.muted{color:var(--ink3)}
.small{font-size:12.5px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.kpi .v{font:600 24px/1.1 var(--f-mono);margin-top:6px;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--ink3);font-weight:500;margin-left:3px}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:3px}
.kpi.good .v{color:var(--ok)}
.kpi.hot{border-color:color-mix(in srgb,var(--peak) 40%,var(--line))}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:20px}}

.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.grid-even{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:820px){.grid-even{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart text{font:11px var(--f-mono);fill:var(--ink3)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .peakband{fill:var(--peakbg)}
.chart .bandlbl{fill:var(--peak);font:600 10px var(--f-body);letter-spacing:.1em}
.chart .fut{fill:var(--future)}
.chart .phl{stroke:var(--ink);stroke-width:1.5}
.chart .hvl{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}
.chart .halo{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.4 var(--f-mono);padding:7px 9px;border-radius:7px;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tip b{font-family:var(--f-body)}

/* plant-now list */
.eq{display:grid;gap:6px}
.eq-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--panel2);font-size:14px}
.eq-row .nm{font:600 14px var(--f-mono);width:44px}
.eq-row .ex{color:var(--ink3);font-size:12.5px;margin-left:auto;text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-run{color:var(--run);background:color-mix(in srgb,var(--run) 13%,transparent)}
.st-idle{color:var(--ink2);background:color-mix(in srgb,var(--idle) 18%,transparent)}
.st-standby{color:var(--ink2);background:color-mix(in srgb,var(--idle) 18%,transparent)}
.st-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.st-ice{color:var(--ice);background:color-mix(in srgb,var(--ice) 14%,transparent)}
.st-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.gauge{height:10px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.gauge > div{height:100%;background:var(--ice);transition:width .25s}
.sec-title{font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:12px 0 6px}

/* feed */
.feed{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto;padding-right:4px}
.fi{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:13.5px}
.fi .t{font:500 12px var(--f-mono);color:var(--ink3)}
.fi.ai{border-color:var(--accent)}
.fi.alert{border-color:var(--peak)}
.fi.esc{border-color:var(--bad)}
.fi .why{color:var(--ink2)}

/* twin */
.twin-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
@media (max-width:1050px){.twin-wrap{grid-template-columns:minmax(0,1fr)}}
.twin-scroll{overflow-x:auto}
.twin{width:100%;min-width:640px;height:auto;display:block}
.twin text{font-family:var(--f-body);fill:var(--ink2)}
.twin .lbl{font:600 13px var(--f-display);letter-spacing:.06em;fill:var(--ink)}
.twin .val{font:500 12px var(--f-mono);fill:var(--ink2)}
.twin .big{font:600 22px var(--f-mono);fill:var(--ink)}
.twin .hit{cursor:pointer}
.twin .hit:hover .body,.twin .sel .body{stroke:var(--accent);stroke-width:2.5}
.twin .body{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;transition:fill .3s,stroke .3s}
.twin .run .body{fill:color-mix(in srgb,var(--run) 16%,var(--panel));stroke:var(--run)}
.twin .bad .body{fill:color-mix(in srgb,var(--bad) 16%,var(--panel));stroke:var(--bad)}
.twin .idle .body{fill:var(--panel2);stroke:var(--idle)}
.twin .fan{stroke:var(--idle);stroke-width:3;fill:none;transform-box:fill-box;transform-origin:center}
.twin .run .fan{stroke:var(--run);animation:spin 1.1s linear infinite}
.twin .bad .fan{stroke:var(--bad)}
.twin .x{display:none;stroke:var(--bad);stroke-width:4}
.twin .bad .x{display:inline}
.twin .billet{fill:var(--panel2);transition:fill .3s}
.twin .run .billet{fill:var(--peak);animation:glow 1.4s ease-in-out infinite}
.twin .ram{fill:var(--idle);transition:transform .3s}
.twin .run .ram{fill:var(--ink2);animation:press 2.2s ease-in-out infinite}
.twin .pipe{fill:none;stroke:var(--line);stroke-width:7;stroke-linecap:round}
.twin .flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 10;opacity:0;transition:opacity .3s}
.twin .flow.on{opacity:1;animation:flow 0.9s linear infinite}
.twin .flow.cold{stroke:var(--ice)}
.twin .flow.pow{stroke:var(--gridc)}
.twin .flow.sun{stroke:var(--solar)}
.twin .panelcell{fill:color-mix(in srgb,var(--ice) 20%,var(--panel));stroke:var(--ink3);stroke-width:1}
.twin .sunon .panelcell{fill:color-mix(in srgb,var(--solar) 45%,var(--panel))}
.twin .hall{fill:var(--panel);stroke:var(--ink3);stroke-width:1.5}
.twin .tankfill{fill:color-mix(in srgb,var(--ice) 55%,var(--panel));transition:y .3s,height .3s}
.twin .tankbody{fill:var(--panel2);stroke:var(--ice);stroke-width:2}
.twin .thermo{fill:var(--ok);transition:height .3s,y .3s}
.twin .thermo.hot{fill:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes glow{50%{opacity:.6}}
@keyframes press{50%{transform:translateY(10px)}}
@media (prefers-reduced-motion: reduce){.twin *{animation:none!important}}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
.det dt{color:var(--ink3)}
.det dd{margin:0;font-family:var(--f-mono);font-size:13px}
.now-box{border-radius:8px;background:var(--panel2);padding:10px 12px;font-size:13.5px}
.now-box b{font-weight:600}
.leg2{display:flex;gap:8px;flex-wrap:wrap}

/* what-if */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-width:0}
.sc:hover{border-color:var(--ink3)}
.sc[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sc .top{display:flex;align-items:center;gap:8px}
.sc .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);color:var(--accent);flex:none}
.sc h4{margin:0;font:600 17px/1.1 var(--f-display)}
.sc p{margin:0;font-size:13px;color:var(--ink2)}
.sc .res{font:500 12px var(--f-mono);color:var(--ink3);margin-top:auto}
.runbox{margin-top:14px}
.progress{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.progress div{height:100%;background:var(--accent);width:0}
.outcome{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
@media (max-width:700px){.outcome{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font:600 11.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-mono)}
tr.chosen td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.resp{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.resp .r{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.resp .r .t{font:500 12px var(--f-mono);color:var(--ink3);padding-top:2px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.form select,.form input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.note{font-size:12.5px;color:var(--ink3);margin-top:8px}

/* compare */
.cmp-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:800px){.cmp-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cmp-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (max-width:820px){.cmp-row{grid-template-columns:minmax(0,1fr)}}
.side-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.side-h .sw{width:10px;height:10px;border-radius:2px}
.readout{font:500 13px var(--f-mono);color:var(--ink2);padding:8px 12px;border-radius:8px;background:var(--panel2);margin-bottom:14px;min-height:36px}
.delta{font:600 13px var(--f-mono)}
.delta.good{color:var(--ok)} .delta.bad{color:var(--bad)}

/* timeline */
.lanes{width:100%;min-width:720px;height:auto;display:block}
.lanes text{font:12px var(--f-body);fill:var(--ink2)}
.lanes .ln{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;fill:var(--ink3)}
.lanes .mk{cursor:pointer}
.lanes .mk:hover,.lanes .mk.sel{stroke:var(--ink);stroke-width:2}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.chain{grid-template-columns:minmax(0,1fr)}}
.step{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel);position:relative;min-width:0}
.step .n{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.step .body{font-size:13.5px;margin-top:6px;overflow-wrap:anywhere}
.step.detect .n{color:var(--peak)} .step.ai .n{color:var(--accent)} .step.val .n{color:var(--ok)} .step.exe .n{color:var(--ice)}
.step.none{opacity:.6}
.filters{display:flex;gap:6px}
.fbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tl-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tl-item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left}
.tl-item:hover{border-color:var(--ink3)}
.tl-item .t{font:600 14px var(--f-mono)}
.tl-item .s{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:13px}
@media (max-width:860px){.tl-item .s{grid-template-columns:minmax(0,1fr)}}
.tl-item .s span b{display:block;font:600 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink3);max-width:100ch}
</style>

<div class="bar">
  <div class="wrap bar-top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><path d="M19 5 9 19h7l-2 10 11-15h-7z" fill="var(--accent-ink)"/></svg>
      <div><h1>Peak Hour Energy Control</h1><div class="sub">Aluminium extrusion plant · AgentX@CCI 2026 · Problem 3</div></div>
    </div>
    <div class="spacer"></div>
    <div class="scen-pick"><label class="eyebrow" for="scen">Scenario</label><select id="scen"></select></div>
    <span class="badge" id="mode"><span class="dot"></span><span>Replay of recorded simulator runs</span></span>
  </div>
  <nav class="wrap tabs" aria-label="Views">
    <a href="#control">Energy Control</a><a href="#twin">Digital Twin</a><a href="#whatif">What-If Simulator</a><a href="#compare">Before vs After</a><a href="#timeline">Decision Timeline</a>
  </nav>
  <div class="wrap play">
    <button class="btn primary" id="playbtn" aria-label="Play the day"><svg width="12" height="12" viewBox="0 0 12 12"><path id="playicon" d="M2 1l9 5-9 5z" fill="currentColor"/></svg><span id="playlbl">Play day</span></button>
    <div class="clock" id="clock">00:00</div>
    <input type="range" class="scrub" id="scrub" min="0" max="95" value="0" aria-label="Time of day">
    <span class="band-chip" id="bandchip">Off-peak · 0.23 AED/kWh</span>
    <div class="speed" role="group" aria-label="Playback speed"><button data-sp="1">1×</button><button data-sp="4" aria-pressed="true">4×</button><button data-sp="12">12×</button></div>
  </div>
</div>

    $('#run-note').textContent = `Live run finished in ${(p.ms / 1000).toFixed(1)} s on the simulator. Every other view now shows this run.`;
  } catch (e) { $('#run-note').textContent = 'The live run failed: ' + e.message + '. Check that the bridge is running.'; }
  btns.forEach(b => b.disabled = false);
}
function runScenarioUI() {
  const sc = scen();
  if (S.live && $('#uselive') && $('#uselive').checked) { if ((sc.faults || []).length && !S.live.faults) { $('#run-note').textContent = 'This scenario needs the fault injector: start with python run_competition.py --platform.'; return; } return liveRun(sc); }
  clearInterval(runState); $('#run-out').innerHTML = `<div class="resp" id="resp" style="margin-top:12px"></div>`; let k = 0; const m = model(sc); S.i = 0;
  $('#run-note').textContent = 'Replaying the recorded simulator run…';
  runState = setInterval(() => {
    k += 2; S.i = clamp(k - 1, 0, 95); $('#prog').style.width = (k / 96 * 100) + '%'; update();
    for (const t of m.inc.filter(t => t.k > k - 2 && t.k <= k)) $('#resp').insertAdjacentHTML('beforeend', respRow(t));
    if (k >= 96) { clearInterval(runState); S.i = defaultI(sc); update(); showResult(sc, true); $('#run-note').textContent = 'Replay finished. The other views now show this scenario.'; }
  }, 70);
}
function respRow(t) {
  const ev = (t.events || []).filter(e => e.type !== 'safety_override').map(evText).join('; ');
  const ai = t.ai ? ` → AI: ${aiText(t.ai)}` : '';
  const v = t.validation ? (t.validation.ok ? ' → plan re-checked: all rules hold' : ' → plan rejected by the checker') : '';
  return `<div class="r"><span class="t">${esc(t.t)}</span><span><b>${esc(ev || 'Event')}</b>${esc(ai)}${esc(v)}${t.cmds && t.cmds.length ? esc(` → ${t.cmds.length} command(s) sent`) : ''}</span></div>`;
}
function showResult(sc, ran) {
  const m = model(sc), k = sc.kpi || {}, sum = sc.sum || {};
  const tile = (l, v, u, d, cls = '') => `<div class="kpi ${cls}"><div class="eyebrow">${l}</div><div class="v">${v}<small>${u}</small></div><div class="d">${d}</div></div>`;
  const opts = (sc.options || []).filter(o => o && o.key);
  const chosen = String(k.what_if_choice || 'A').slice(0, 1);
  $('#run-out').innerHTML = `${ran ? '' : ''}<div class="outcome">
    ${tile('Energy cost saved', n1(sum.saving_pct), '%', `${n0(sum.cost_aed)} AED vs ${n0(sum.baseline_cost_aed)} AED baseline`, sum.saving_pct > 0 ? 'good' : '')}
    ${tile('Peak demand', n0(sum.peak_kw), 'kW', `baseline ${n0(sum.baseline_peak_kw)} kW`)}
    ${tile('Rule violations', (sum.violations || []).length, '', `${(sum.late_orders || []).length} late orders · ${sum.comfort_violation_minutes ?? 0} min outside 20–27 °C`, (sum.violations || []).length ? 'hot' : 'good')}
    ${tile('AI calls', k.ai_calls ?? 0, '', `${k.escalations ?? 0} escalations · ${(sc.tool_errors || []).length} tool errors handled`)}
  </div>
  ${k.demand_response ? `<p class="small"><b>Demand response:</b> ${esc(k.demand_response)}</p>` : ''}
  <div class="grid2" style="margin-top:6px"><div style="min-width:0"><div class="sec-title">How the agent responded</div><div class="resp">${m.inc.map(respRow).join('') || '<div class="muted small">A quiet day: only the hourly re-plans. Open the Decision Timeline to see them.</div>'}</div></div>
  <div style="min-width:0"><div class="sec-title">Options the operator saw at 00:00</div><div class="tbl-wrap"><table><thead><tr><th>Option</th><th>Energy AED</th><th>Demand AED</th><th>Peak kW</th><th>Floor max*</th><th>Late</th></tr></thead><tbody>${opts.map(o => `<tr class="${o.key === chosen ? 'chosen' : ''}"><td>${esc(o.key)} · ${esc(o.label)}${o.key === chosen ? ' ✓' : ''}</td><td>${n0(o.energy_cost_aed)}</td><td>${n0(o.demand_charge_aed)}</td><td>${n0(o.peak_kw)}</td><td>${o.floor_max_stress_c ?? '–'} °C</td><td>${o.late_orders ?? '–'}</td></tr>`).join('')}</tbody></table></div><div class="note">* predicted with the weather 1 °C hotter than forecast. D is the do-nothing reference and cannot be chosen. The plant later re-plans every hour, so the final cost differs from these day-start estimates.</div></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn" href="#twin">Watch it in the Digital Twin</a><a class="btn" href="#compare">Compare with no agent</a><a class="btn" href="#timeline">Open the decision timeline</a></div>`;
}

// ===== 4. Before vs After
function viewCompare() {}
viewCompare.render = () => {
  const sc = scen(), m = model(sc), b = m.base, off = b.official || {}, sum = sc.sum || {}, bs = b.sum || {};
  const pk = Math.max(...m.grid_kw), bpk = Math.max(...m.b_grid_kw), pki = m.grid_kw.indexOf(pk), bpki = m.b_grid_kw.indexOf(bpk);
  const fmax = Math.max(...m.floor_c), bfmax = Math.max(...m.b_floor_c);
  const dl = (a, b2, u, lowGood = true) => { const d = a - b2; const good = lowGood ? d < 0 : d > 0; return `<span class="delta ${Math.abs(d) < 1e-9 ? '' : good ? 'good' : 'bad'}">${d > 0 ? '+' : ''}${n0(d)} ${u}</span>`; };
  const tile = (l, a, bb, u, extra) => `<div class="kpi"><div class="eyebrow">${l}</div><div class="v">${a}<small>${u}</small></div><div class="d">without agent ${bb} ${u} · ${extra}</div></div>`;
  const dpk = 45 / 31;
  $('#main').innerHTML = head('Before vs After', 'The same day in the same simulator, run twice: once with no agent (orders start as early as possible, no ice strategy) and once with our agent. Hover any chart to compare both at the same moment.') + `
  <div class="cmp-sum">
    ${tile('Energy cost', n0(sum.cost_aed), n0(bs.cost_aed), 'AED', dl(sum.cost_aed, bs.cost_aed, 'AED'))}
    ${tile('Peak demand', n0(pk), n0(bpk), 'kW', dl(pk, bpk, 'kW') + ` · demand charge ${dl(pk * dpk, bpk * dpk, 'AED/day')}`)}
    ${tile('Hottest floor', n1(fmax), n1(bfmax), '°C', 'limit 27 °C')}
    ${tile('Grid energy', n0(sum.grid_kwh), n0(bs.grid_kwh), 'kWh', dl(sum.co2_kg, bs.co2_kg, 'kg CO₂'))}
  </div>
  <div class="readout" id="readout">Hover a chart to read both runs at the same time.</div>
  ${['grid', 'cost', 'temp'].map(r => `<div class="cmp-row">${['b', 'a'].map(side => `<div class="panel"><div class="side-h"><span class="sw" style="background:${side === 'b' ? 'var(--base)' : 'var(--accent)'}"></span><h3>${{ grid: 'Grid power', cost: 'Cost so far', temp: 'Floor temperature' }[r]} · ${side === 'b' ? 'without agent' : 'with agent'}</h3></div><div id="cmp-${r}-${side}"></div></div>`).join('')}</div>`).join('')}
  <p class="foot">The organisers' official baseline for this day is ${n0(off.baseline_cost_aed)} AED with a ${n0(off.baseline_peak_kw)} kW peak. The saving on the scorecard (${n1(sum.saving_pct)}%) is measured against that figure. The do-nothing run shown here is our replay in the same simulator, so you can see the hour-by-hour difference${Math.abs((bs.cost_aed || 0) - (off.baseline_cost_aed || 0)) / (off.baseline_cost_aed || 1) > 0.03 ? `. On this day our replay (${n0(bs.cost_aed)} AED) differs from the official baseline because the organisers' baseline schedules the presses differently` : `; it lands within ${n1(Math.abs((bs.cost_aed || 0) - (off.baseline_cost_aed || 0)) / (off.baseline_cost_aed || 1) * 100)}% of the official figure`}.</p>`;
  const gmax = Math.max(bpk, pk, CAP) * 1.05, cmax = Math.max(m.cum[95], m.b_cum[95]) * 1.05;
  const tipG = i => `<b>${hm(i)}</b><br>Without agent ${n0(m.b_grid_kw[i])} kW<br>With agent ${n0(m.grid_kw[i])} kW`;
  chart($('#cmp-grid-b'), { label: 'Grid power without agent', h: 220, ymax: gmax, ymin: 0, series: [{ v: m.b_grid_kw, color: 'var(--base)', area: true, w: 2 }], hl: [{ y: CAP, label: 'peak limit', color: 'var(--peak)' }], marks: [{ i: bpki, v: bpk, label: `peak ${n0(bpk)} kW`, color: 'var(--bad)' }], tip: tipG });
  chart($('#cmp-grid-a'), { label: 'Grid power with agent', h: 220, ymax: gmax, ymin: 0, series: [{ v: m.grid_kw, color: 'var(--accent)', area: true, w: 2 }], hl: [{ y: CAP, label: 'peak limit', color: 'var(--peak)' }], marks: [{ i: pki, v: pk, label: `peak ${n0(pk)} kW`, color: 'var(--bad)' }], tip: tipG });
  const tipC = i => `<b>${hm(i)}</b><br>Without agent ${n0(m.b_cum[i])} AED<br>With agent ${n0(m.cum[i])} AED<br>Saved so far ${n0(m.b_cum[i] - m.cum[i])} AED`;
  chart($('#cmp-cost-b'), { label: 'Cost without agent', h: 200, ymin: 0, ymax: cmax, series: [{ v: m.b_cum, color: 'var(--base)', w: 2.2 }], tip: tipC });
  chart($('#cmp-cost-a'), { label: 'Cost with agent', h: 200, ymin: 0, ymax: cmax, series: [{ v: m.b_cum, color: 'var(--base)', w: 1, dash: '3 3' }, { v: m.cum, color: 'var(--accent)', w: 2.2 }], tip: tipC });
  const tipT = i => `<b>${hm(i)}</b><br>Without agent ${n1(m.b_floor_c[i])} °C<br>With agent ${n1(m.floor_c[i])} °C`;
  const tb = [{ a: 0, b: 96, y0: 20, y1: 27, fill: 'var(--ok)', op: .08, label: 'allowed 20–27 °C' }];
  chart($('#cmp-temp-b'), { label: 'Floor temperature without agent', h: 180, ymin: 18, ymax: 30, step: 2, fmt: v => v + '°', bands: tb, series: [{ v: m.b_floor_c, color: 'var(--base)', w: 2.2 }], tip: tipT });
  chart($('#cmp-temp-a'), { label: 'Floor temperature with agent', h: 180, ymin: 18, ymax: 30, step: 2, fmt: v => v + '°', bands: tb, series: [{ v: m.floor_c, color: 'var(--accent)', w: 2.2 }], tip: tipT });
};
viewCompare.update = (sc, m, i) => { if (S.hover == null) readout(i); };
function readout(i) {
  const sc = scen(), m = model(sc), j = i == null ? S.i : i, el = $('#readout'); if (!el) return;
  el.innerHTML = `${hm(j)} · grid <b>${n0(m.b_grid_kw[j])}</b> → <b>${n0(m.grid_kw[j])}</b> kW · cost so far <b>${n0(m.b_cum[j])}</b> → <b>${n0(m.cum[j])}</b> AED (saved ${n0(m.b_cum[j] - m.cum[j])}) · floor <b>${n1(m.b_floor_c[j])}</b> → <b>${n1(m.floor_c[j])}</b> °C`;
}

// ===== 5. Decision timeline
const EVT = {
  chiller_trip: e => `Chiller ${e.chiller} stopped working`, chiller_recovered: e => `Chiller ${e.chiller} is back`, new_order: e => `New ${e.priority === 'rush' ? 'rush ' : ''}order ${e.order} (due ${String(e.due_hour).padStart(2, '0')}:00)`,
  order_cancelled: e => `Order ${e.order} was cancelled`, forecast_deviation: e => `Weather ${e.dT > 0 ? '+' : ''}${e.dT} °C off the forecast`, floor_high: e => `Floor warm: ${e.floor} °C`,
  demand_response: e => `Utility request: keep grid ≤ ${n0(e.cap_kw)} kW (${e.window})`, sensor_fault: e => `Bad sensor data: ${String(e.detail || '').replace(/_/g, ' ').slice(0, 90)}`, invalid_order: e => `Suspicious order ${e.order}: ${e.problems}`,
  order_infeasible: e => `Order(s) ${(e.orders || []).join(', ')} cannot finish on time`, validation_failed: () => 'Plan failed the rule check', error: () => 'Unexpected data error', safety_override: e => `Cooling looked short (need ~${n0(e.load)} kW)`
};
const evText = e => (EVT[e.type] || (x => x.type))(e);
const aiText = a => { const d = a.decision || (typeof a.answer === 'object' ? a.answer : null); if (!d) return `answer rejected (${a.note || 'not valid JSON'})`; return `${d.strategy}${d.strategy === 'conservative' ? ` (≥${Math.round(d.min_margin * 100)}% margin)` : ''} – ${d.reason}${a.applied ? '' : d.strategy === 'conservative' ? '' : ''}`; };
const cmdText = c => c.tool === 'set_chiller_state' ? `${c.args.chiller_id} ${c.args.state}` : c.tool === 'set_storage_mode' ? `ice ${c.args.mode}${c.args.mode === 'idle' ? '' : ' ' + n0(c.args.rate_kwth) + ' kW'}` : c.tool === 'schedule_batch' ? `${c.args.order_id} → ${c.args.press_id} at ${String(c.args.start_time).slice(11, 16)}` : c.tool;
function viewTimeline() {}
viewTimeline.render = () => {
  const sc = scen(), m = model(sc), W = 1100, pl = 150, pr = 16, lane = 46, top = 26, H = top + 4 * lane + 26;
  const X = k => pl + k / 96 * (W - pl - pr);
  const lanes = ['Detected', 'AI recommended', 'Safety check', 'Action executed'], colors = ['var(--peak)', 'var(--accent)', 'var(--ok)', 'var(--ice)'];
  let s = `<svg viewBox="0 0 ${W} ${H}" class="lanes" role="img" aria-label="Decision timeline"><rect x="${X(48)}" y="${top - 10}" width="${X(72) - X(48)}" height="${4 * lane + 6}" fill="var(--peakbg)"/>`;
  for (const h of [0, 3, 6, 9, 12, 15, 18, 21, 24]) s += `<line x1="${X(h * 4)}" x2="${X(h * 4)}" y1="${top - 10}" y2="${top + 4 * lane - 4}" stroke="var(--line)"/><text x="${X(h * 4)}" y="${H - 6}" text-anchor="middle" style="font-family:var(--f-mono);font-size:11px;fill:var(--ink3)">${String(h).padStart(2, '0')}:00</text>`;
  lanes.forEach((l, r) => { const y = top + r * lane + 14; s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/><text class="ln" x="10" y="${y + 4}">${l}</text>`; });
  for (const t of m.trace) {
    const x = X(t.k), inc = (t.events || []).some(e => e.type !== 'safety_override') || t.ai, y = r => top + r * lane + 14;
    if ((t.events || []).some(e => e.type !== 'safety_override')) s += `<circle class="mk" data-k="${t.k}" cx="${x}" cy="${y(0)}" r="8" fill="${colors[0]}"><title>${esc(t.t)} ${esc(t.events.filter(e => e.type !== 'safety_override').map(evText).join('; '))}</title></circle>`;
    if (t.ai) s += `<rect class="mk" data-k="${t.k}" x="${x - 8}" y="${y(1) - 8}" width="16" height="16" rx="3" transform="rotate(45 ${x} ${y(1)})" fill="${colors[1]}"><title>${esc(t.t)} AI: ${esc(aiText(t.ai))}</title></rect>`;
    const so = (t.events || []).some(e => e.type === 'safety_override');
    if (t.validation || so) s += `<circle class="mk" data-k="${t.k}" cx="${x}" cy="${y(2)}" r="${inc || so ? 7 : 3.5}" fill="${t.validation && !t.validation.ok ? 'var(--bad)' : so ? 'var(--warn)' : colors[2]}"><title>${esc(t.t)} ${so ? 'safety layer added cooling' : t.validation.ok ? 'plan passed every rule' : 'plan rejected'}</title></circle>`;
    if ((t.cmds || []).length) s += `<rect class="mk" data-k="${t.k}" x="${x - 2}" y="${y(3) - 2 - Math.min(10, t.cmds.length * 3)}" width="4" height="${4 + Math.min(20, t.cmds.length * 6)}" rx="2" fill="${t.cmds.some(c => !c.ok) ? 'var(--bad)' : colors[3]}"><title>${esc(t.t)} ${esc(t.cmds.map(cmdText).join(', '))}</title></rect>`;
  }
  s += `<line class="phl" id="tl-ph" x1="0" x2="0" y1="${top - 10}" y2="${top + 4 * lane - 4}" style="stroke:var(--ink);stroke-width:1.5"/></svg>`;
  $('#main').innerHTML = head('Decision Timeline', 'Every decision in four steps: what the agent noticed, what the AI advised, what the safety checker approved and which commands went to the plant. The AI is only asked on unusual events; routine hours are planned without it.') + `
  <div class="panel"><div style="overflow-x:auto">${s}</div><div class="leg2" style="margin-top:6px"><span class="muted small">Big marks are incidents, small green dots are the routine hourly re-plans. Orange means the 15-minute safety layer added cooling; red means a rejected plan or a failed command. Click a mark for the full chain.</span></div></div>
  <div class="panel" style="margin-top:14px"><div class="ph"><h3 id="ch-h">Decision chain</h3><span class="mono muted small" id="ch-t"></span></div><div class="chain" id="chain"></div></div>
  <div class="ph" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="font-size:20px">Decision log</h3><div class="filters"><button class="fbtn" data-f="inc" aria-pressed="${S.tlFilter === 'inc'}">Incidents</button><button class="fbtn" data-f="all" aria-pressed="${S.tlFilter === 'all'}">Every decision</button></div></div>
  <div class="tl-list" id="tl-list"></div>`;
  tl.X = X;
  document.querySelectorAll('.lanes .mk').forEach(el => el.addEventListener('click', () => { S.tlSel = +el.dataset.k; seek(clamp(S.tlSel, 0, 95)); }));
  document.querySelectorAll('.fbtn').forEach(b => b.onclick = () => { S.tlFilter = b.dataset.f; document.querySelectorAll('.fbtn').forEach(x => x.setAttribute('aria-pressed', x === b)); tlList(); });
  tlList();
};
function tl() {}
function tlList() {
  const sc = scen(), m = model(sc);
  const rows = (S.tlFilter === 'inc' ? m.inc : m.trace.filter(t => t.validation || (t.events || []).length || t.ai || (t.cmds || []).length));
  $('#tl-list').innerHTML = rows.map(t => { const c = chainParts(sc, t); return `<button class="tl-item" data-k="${t.k}"><span class="t">${esc(t.t)}</span><span class="s"><span><b>Detected</b>${esc(c.det)}</span><span><b>AI</b>${esc(c.ai)}</span><span><b>Safety check</b>${esc(c.val)}</span><span><b>Executed</b>${esc(c.exe)}</span></span></button>`; }).join('') || '<div class="muted">No incidents on this day. Switch to “Every decision” to see the hourly re-plans.</div>';
  document.querySelectorAll('.tl-item').forEach(b => b.onclick = () => { S.tlSel = +b.dataset.k; seek(clamp(S.tlSel, 0, 95)); scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
}
function chainParts(sc, t) {
  const ev = (t.events || []).filter(e => e.type !== 'safety_override'), so = (t.events || []).find(e => e.type === 'safety_override');
  const det = ev.length ? ev.map(evText).join('; ') : (t.k % 4 === 0 ? 'Hourly check: nothing unusual' : 'Routine 15-minute check');
  const ai = t.ai ? aiText(t.ai) + (t.ai.applied ? ' (applied)' : t.ai.decision && t.ai.decision.strategy === 'escalate' ? ' (sent to a human)' : t.ai.decision ? ' (no plan change needed)' : '') : (ev.length ? 'Not asked (AI is used only for listed unusual events)' : 'Not needed – routine hour');
  const val = t.validation ? (t.validation.ok ? `Plan passed: 20–27 °C with +1 °C stress, every order on time, a backup chiller kept${t.margin != null ? `, ${Math.round(t.margin * 100)}% cooling margin` : ''}` : 'Plan rejected: ' + (t.validation.violations || []).join('; ')) + (so ? `. Safety layer: +cooling (need ~${n0(so.load)} kW)` : '') : so ? `Safety layer added cooling (need ~${n0(so.load)} kW)` : 'Kept the last checked plan';
  const exe = (t.cmds || []).length ? t.cmds.map(c => cmdText(c) + (c.ok ? '' : ` (failed: ${c.error})`)).join(', ') : 'No change needed';
  return { det, ai, val, exe };
}
viewTimeline.update = (sc, m, i) => {
  const l = $('#tl-ph'); if (l) { const x = tl.X(i + 1); l.setAttribute('x1', x); l.setAttribute('x2', x); }
  const k = S.tlSel != null ? S.tlSel : (m.inc.filter(t => t.k <= i + 1).slice(-1)[0] || m.trace.filter(t => t.k <= i + 1 && t.validation).slice(-1)[0] || m.trace[0]).k;
  const t = m.trace.find(x => x.k === k) || m.trace[0];
  document.querySelectorAll('.lanes .mk').forEach(el => el.classList.toggle('sel', +el.dataset.k === t.k));
  const c = chainParts(sc, t);
  $('#ch-t').textContent = t.t; $('#ch-h').textContent = 'Decision chain';
  const step = (cls, n, b, none) => `<div class="step ${cls} ${none ? 'none' : ''}"><div class="n">${n}</div><div class="body">${esc(b)}</div></div>`;
  $('#chain').innerHTML = step('detect', '1 · Detected', c.det) + step('ai', '2 · AI recommended', c.ai, !t.ai) + step('val', '3 · Safety check approved', c.val) + step('exe', '4 · Action executed', c.exe);
  if (S.tlSel != null && Math.abs(S.tlSel - (i + 1)) > 1 && Math.abs(S.tlSel - i) > 1) S.tlSel = null;
};

// ------------------------------------------------------------ live mode
async function detectLive() {
  // same origin (served by the bridge) first, then the default bridge port (page opened from VS Code Live Server or a file)
  const bases = [];
  if (/^https?:$/.test(location.protocol)) bases.push('');
  bases.push('http://localhost:8765');
  for (const base of bases) {
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 1500);
      const r = await fetch(base + '/health', { signal: ctl.signal }); const j = await r.json();
      if (j && j.ok && typeof CORE !== 'undefined' && typeof RUNNER !== 'undefined') {
        S.live = { faults: !!j.faults, base };
        const b = $('#mode'); b.classList.add('live'); b.lastElementChild.textContent = j.faults ? 'Live simulator connected' : 'Live simulator connected (no fault injector)';
        if (S.view === 'whatif') render();
        return;
      }
    } catch (e) { /* try the next one; replay only if none answers */ }
  }
}

let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const c = S.charts[0]; if (c && Math.abs(+c.svg.parentElement.dataset.w - c.svg.parentElement.clientWidth) > 40) render(); }, 200); });
fillScenarioSelect();
route();
detectLive();
})();
</script>
